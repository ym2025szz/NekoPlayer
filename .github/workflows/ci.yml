name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare verified local runtimes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./setup-ffmpeg.ps1
          ./setup-music-gateway.ps1
      - name: Build, test and package Windows stable runtime
        shell: pwsh
        run: ./publish-win-x64.ps1
      - name: Verify repeated decoding without speakers
        shell: pwsh
        run: dotnet run --project tools/NekoPlayer.LoopVerifier/NekoPlayer.LoopVerifier.csproj -c Release -- --iterations 20
      - name: Retain verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: |
            artifacts/loop-verifier-v1.2.0/loop-verification.json
            artifacts/test-reports/
          if-no-files-found: ignore
